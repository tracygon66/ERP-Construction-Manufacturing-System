name: ERP Core System CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -------------------------------------------------------------
  # 1. BACKEND QUALITY GATE (.NET 8 Clean Architecture)
  # -------------------------------------------------------------
  backend-quality-gate:
    name: Backend Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore backend/ErpSystem.sln

      - name: Build Solution (Release)
        run: dotnet build backend/ErpSystem.sln --configuration Release --no-restore

      - name: Run Unit & Architecture Tests
        run: dotnet test backend/ErpSystem.sln --configuration Release --no-build --verbosity normal

  # -------------------------------------------------------------
  # 2. FRONTEND QUALITY GATE (React 18 + TypeScript + Vite)
  # -------------------------------------------------------------
  frontend-quality-gate:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Production Build
        run: npm run build
