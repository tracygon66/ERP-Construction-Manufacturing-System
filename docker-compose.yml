version: '3.8'

services:
  # -------------------------------------------------------------
  # DATABASE: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_secure_password_2026
      POSTGRES_DB: erp_core_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_core_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # CACHING & DISTRIBUTED LOCKS: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # MESSAGE BROKER: RabbitMQ with Management Web UI
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: erp_guest
      RABBITMQ_DEFAULT_PASS: erp_guest_2026
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # -------------------------------------------------------------
  # BACKEND: .NET 8 Web API
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: erp_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=erp_core_db;Username=erp_admin;Password=erp_secure_password_2026;
      - UseInMemoryDatabase=false
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # -------------------------------------------------------------
  # FRONTEND: React 18 + Vite
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: erp_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
